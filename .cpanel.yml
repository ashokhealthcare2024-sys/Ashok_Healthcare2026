---
deployment:
  tasks:
    # ==========================================================================
    # ASHOK HEALTHCARE - BLUEHOST CPANEL GIT DEPLOYMENT
    # Target: $HOME/public_html/
    # Apache / Static HTML Website
    # ==========================================================================

    # 1. SET DEPLOYMENT PATH
    - export DEPLOYPATH=${DEPLOYPATH:-$HOME/public_html/}
    - /bin/mkdir -p "$DEPLOYPATH"

    # 2. DEPLOY EVERY ROOT HTML PAGE, INCLUDING LEGACY REDIRECTS
    - for FILE in ./*.html; do [ -f "$FILE" ] || continue; /bin/cp -f "$FILE" "$DEPLOYPATH"; done

    # 3. DEPLOY APACHE & SEARCH ENGINE CONFIGURATIONS
    - /bin/cp -f .htaccess "$DEPLOYPATH"
    - /bin/cp -f robots.txt "$DEPLOYPATH"
    - /bin/cp -f sitemap.xml "$DEPLOYPATH"

    # 4. DEPLOY OPTIONAL RSS FEED
    - if test -f rss.xml; then /bin/cp -f rss.xml "$DEPLOYPATH"; fi

    # 5. DEPLOY ALL PAGE AND ASSET DIRECTORIES
    - for DIR in */; do [ -d "$DIR" ] || continue; /bin/cp -R -f "$DIR" "$DEPLOYPATH"; done

    # 6. SET DIRECTORY PERMISSIONS
    - /bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} + 2>/dev/null || true

    # 7. SET FILE PERMISSIONS
    - /bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} + 2>/dev/null || true

    # ==========================================================================
    # END OF DEPLOYMENT
    # ==========================================================================
